[Zalo]
ExeName=Zalo.exe
; Để trống = tự tìm đường dẫn Zalo phổ biến khi LaunchZaloIfMissing=1
ExePath=

[Paths]
DataDir=data
ListingsFile=data\listings.json
ListingsDir=data\listings
MediaDir=data\media
QueueDir=data\queue
QueueEventsFile=data\queue\events.jsonl
QueueSnapshotFile=data\queue\snapshot.json
QueueLogFile=data\queue\publish.log
AccessLogFile=data\access_log.json
HarvestStateFile=data\harvest_state.json
; Per-group state avoids rewriting one huge JSON file after every group.
HarvestStateDir=data\harvest_state
GroupListCaptureFile=data\zalo-groups-capture.txt

[Groups]
; Khi bot start: popup keo-tha/chon file CSV/XLSX chua danh sach input.
; File danh sach nhom input (cot group_name). Mau: config\source-groups.example.csv
SourceFile=config\source-groups.csv
PromptSourceFileOnStart=0
SourceSheet=
SourceColumn=group_name
; Nap lai file truoc moi vong; thu tu nhom luon giong thu tu dong trong file.
ReloadSourceFileEachCycle=1
; Nhom output phan cach bang ky tu | va bi loai neu co trong file input.
OutputGroups=Giỏ hàng cao thiên ⏏️ 6tr Phú Nhuận Bình Thạnh|Giỏ hàng cao thiên ⬇️ 5tr9 Phú Nhuận Bình Thạnh|Giỏ Hàng "Quận Ngoại Thành" Cao Thiên|Giỏ hàng Quận số Cao Thiên|Giỏ hàng NNC Cao Thiên.
; Cac tuy chon UI cu duoc giu cho diagnostic/anh; source list khong con doc Alt+3.
ListTabHotkey=!3
; accessibility = MSAA only. hybrid = MSAA then clipboard. manual = groups-manual.txt.
DiscoveryMode=hybrid
ListSettleMs=1500
ListScanPages=30
; Khong click toa do pane moi vong (tranh chuot bi keo sai vi tri / DPI).
ListUsePaneClick=0
; Chi bat khi da calibrate ListPaneClickX/Y dung voi man hinh cua ban.
UiUseRatioClicks=1
RefreshEveryCycles=12
ListPaneClickX=0.20
ListPaneClickY=0.42
CommunityTabClickX=0.28
CommunityTabClickY=0.14
CaptureCommunities=1
ListScrollMode=wheel
ListWheelSteps=8
AccessibilityDepth=18
AccessibilityLeftRatio=0.52
; 0 = mo nhom bang Ctrl+F (on dinh hon). 1 = click MSAA ListItem (can DPI dung).
PreferAccessibleConversationClick=0
VerifyActiveConversation=1
; Fallback: 1 ten nhom/cong dong moi dong khi Zalo khong copy duoc text.
ManualListFile=config\groups-manual.txt
; Text marker xuất hiện gần tên nhóm khi Zalo expose trạng thái chưa đọc.
; Text marker OR bare numeric badge (1–999) next to group name in Acc sidebar.
UnreadMarkerPattern=i)(?:tin nhắn mới|tin chưa đọc|chưa đọc|unread|new messages?)
; Nếu text copy từ Zalo có thêm nhãn giao diện, thêm vào đây, phân cách bằng |.
IgnoredLabels=

; Chỉ blocklist vẫn dùng Excel/CSV.
BlocklistXlsx=config\zalo-groups.xlsx
BlocklistSheet=Blocklist
BlocklistCsv=config\blocklist.csv

[Capture]
; selectall = Ctrl+A trong khung chat (on dinh). accessibility = MSAA, co the thieu text.
Method=selectall
AccessibilityFallback=selectall
ListingStartPattern=
ImageMarkerPattern=
MaxMessagesPerGroup=50
; Để trống = chỉ dùng heuristic (LooksLikeListing). Có thể ghi: address,price,owner_phone
RequiredFields=

[Output]
Separator=------------{group}------------
MaxMessageChars=1800
; 0 = dán SĐT thật + nhà mạng vào "📞 Số chủ:". 1 = che bằng PhoneHint.
MaskPhone=0
PhoneHint=Nhắn bot "SĐT {room_code}" để lấy số
; Luôn 1 phòng / chu kỳ: ảnh → text → message ngăn cách (code khóa OneMessagePerListing=1).
OneMessagePerListing=1
ListingsPerMessage=1
ListingSeparator=======
; Gửi ListingSeparator thành tin nhắn riêng sau mỗi phòng.
SendSeparatorAsMessage=1
IncludeGroupHeader=0

[Images]
; clipboard = chuột phải "Copy hình ảnh" → archive .clip → paste nhóm main.
; forward = hộp thoại Chuyển tiếp. Zalo thường KHÔNG đưa ảnh vào clipboard bằng Ctrl+C.
Strategy=clipboard
ForwardHotkey=^q
ImageCopyHotkey=^c
; Gửi ảnh trước text, lặp theo image_count từng phòng trong batch.
ImagesBeforeText=1
RelayPerListing=1
RelayPauseMs=5000
; 0 = gửi text ngay (kể cả khi chưa archive ảnh). 1 = phải archive ảnh trước.
MediaRequired=1
MediaCapturePauseMs=5000
; 1 = archive ảnh gần mã phòng khi harvest (ảnh gửi trước text).
AutoCapture=1
AutoCaptureAnchor=room_code
AutoCaptureMaxRetries=2
; Tìm graphic bubble gần anchor qua accessibility, copy từng ảnh riêng.
AutoCaptureMode=accessibility
AutoCaptureProbeImages=1
AutoCaptureProbeMaxImages=12
AutoCaptureReplaceUntrusted=1
AutoCaptureRepairPerCycle=3
ImageCandidateMaxDistancePx=900
ImageCandidateDirection=above
ImageCandidateMinWidthPx=60
ImageCandidateMinHeightPx=60
ImageViewerSettleMs=700
; Phím tắt menu chuột phải Zalo: thử lần lượt (c / i = Copy hình ảnh).
ImageContextCopyKey=c
ImageContextCopyKeys=c,i
ImageSelectMode=shift_up
ImageSelectStepPx=80
FindInChatHotkey=^f

[Relay]
; 0 = images + text (mặc định). 1 = chỉ text, tắt AutoCapture/MediaRequired.
TextOnly=0

[Watch]
IntervalMs=300000
DrainQueueEachCycle=1
; Vong 1 quet toan bo file; tu vong 2 chi quet nhom trong file co tin chua doc.
OnlyUnreadAfterFirstCycle=1
BypassSessionCooldown=1
ActiveHoursStart=
ActiveHoursEnd=
StopOnUncertain=1

[Startup]
; 1 = tự chạy watch loop khi mở Bot.ahk (không cần hotkey)
AutoRunWatch=1
WaitForZaloSeconds=120
LaunchZaloIfMissing=1
StartupDelayMs=3000
MaximizeZalo=0
RequireAdmin=0
; 1 = giữ hotkey thủ công (H/G/W/…). 0 = chỉ chạy tự động.
EnableHotkeys=0
; Hien nut do luon tren cung de dung watch/publish an toan.
ShowStopButton=1

[Timing]
SearchDelayMs=400
OpenChatDelayMs=800
PasteDelayMs=200
SendDelayMs=300
BetweenMessagesMs=900
BetweenGroupsMs=1200
ForwardDialogMs=900
ClipWaitSeconds=3
CaptureSettleMs=600
AfterPublishRecheckMs=800

[Batch]
; Legacy key — runtime luôn Size=1 (không còn harvest batch 5 nhóm).
Size=1
RecheckAfterPublish=0
BetweenBatchesMs=2000

[Harvest]
; Vòng đầu quét toàn bộ để tạo baseline. Từ vòng 2: unread + audit shard.
InitialFullScan=1
MaxGroupsPerCycle=50
AuditGroupsPerCycle=10
; Sau mỗi nhóm nguồn có tin mới, publish sang từng nhóm chính (1 phòng/lượt).
PublishAfterGroups=1
SaveStateEachGroup=1

[RateLimit]
; Giới hạn tổng publish trong một watch cycle và thêm jitter chống burst.
MaxBatchesPerWatchCycle=10
SendDelayMinMs=3000
SendDelayMaxMs=7000
OutputGroupDelayMinMs=5000
OutputGroupDelayMaxMs=10000
HarvestGroupDelayMinMs=800
HarvestGroupDelayMaxMs=1600

[PublishQueue]
LeaseSize=1
LeaseTimeoutMs=7200000
MaxAttempts=3
RetryBackoffSeconds=300
CompactEveryEvents=250
MaxBatchesPerSession=20
SessionCooldownMs=300000
ListingTtlDays=30
; Optional HH:mm window. Leave both blank to allow manual sessions at any time.
ActiveHoursStart=
ActiveHoursEnd=

[State]
MaxSeenHashes=2000

[Hotkeys]
ForwardListing=^+b
ReleasePhone=^+p
HarvestAll=^+h
PublishMain=^+g
HarvestAndPublish=^+j
RelayImages=^+i
ArchiveMedia=^+m
PausePublish=^+o
StopPublish=^+k
ResolveUncertain=^+u
ReloadConfig=^+r
ToggleWatch=^+w
