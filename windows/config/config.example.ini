[ZaloWeb]
BrowserExe=chrome.exe
WindowTitle=[ZaloBot]
ChatUrl=https://chat.zalo.me/#bot
; Điền đường dẫn chrome.exe. Để trống bot tự tìm; không được mở URL bằng trình duyệt mặc định.
ChromePath=
BridgeHost=127.0.0.1
BridgePort=8080

[Paths]
DataDir=data
ListingsFile=data\listings.json
ListingsDir=data\listings
MediaDir=data\media
QueueDir=data\queue
QueueEventsFile=data\queue\events.jsonl
QueueSnapshotFile=data\queue\snapshot.json
QueueLogFile=data\queue\publish.log
AccessLogFile=data\access_log.json
HarvestStateFile=data\harvest_state.json
HarvestStateDir=data\harvest_state

[Diagnostics]
Enabled=0
LogFile=data\ui-diagnostic.jsonl

[Groups]
SourceFile=config\source-groups.csv
PromptSourceFileOnStart=0
SourceSheet=
SourceColumn=group_name
ReloadSourceFileEachCycle=1
; 1 tab: harvest nhóm nguồn rồi route từng phòng vào đúng nhóm output.
OutputGroups=Giỏ hàng “QUẬN Ngoại Thành ” Cao Thiên|Giỏ hàng QUẬN SỐ Cao Thiên|Giỏ hàng Cao Thiên 6Triệu Phú Nhuận, Bình Thạnh|Giỏ Hàng Cao Thiên Dưới 5TR9 Phú Nhuận Bình Thạnh
UnreadMarkerPattern=i)(?:tin nhắn mới|tin chưa đọc|chưa đọc|unread|new messages?)
BlocklistXlsx=config\zalo-groups.xlsx
BlocklistSheet=Blocklist
BlocklistCsv=config\blocklist.csv

[OutputRouting]
GroupQuanSo=Giỏ hàng QUẬN SỐ Cao Thiên
GroupNgoaiThanh=Giỏ hàng “QUẬN Ngoại Thành ” Cao Thiên
GroupUnder59=Giỏ Hàng Cao Thiên Dưới 5TR9 Phú Nhuận Bình Thạnh
GroupOver6=Giỏ hàng Cao Thiên 6Triệu Phú Nhuận, Bình Thạnh

[Capture]
ListingStartPattern=
ImageMarkerPattern=
MaxMessagesPerGroup=50
MaxScanMessages=50
RequiredFields=

[Output]
MaxMessageChars=1800
MaskPhone=0
PhoneHint=Nhắn bot "SĐT {room_code}" để lấy số
OneMessagePerListing=1
ListingsPerMessage=1
ListingSeparator=======
SendSeparatorAsMessage=1

[Images]
ImagesBeforeText=1
MediaRequired=1
MediaCapturePauseMs=5000
AutoCapture=1
AutoCaptureAnchor=room_code
AutoCaptureMaxRetries=2
AutoCaptureProbeImages=1
AutoCaptureProbeMaxImages=16
AutoCaptureReplaceUntrusted=1
AutoCaptureRepairPerCycle=0

[Relay]
TextOnly=0

[Watch]
IntervalMs=300000
DrainQueueEachCycle=1
; Mỗi vòng harvest đủ mọi nhóm trong file nguồn (không chỉ unread).
OnlyUnreadAfterFirstCycle=0
BypassSessionCooldown=1
ActiveHoursStart=
ActiveHoursEnd=
; Không dừng vòng harvest khi publish uncertain; chỉ bỏ qua publish.
StopOnUncertain=0

[Startup]
AutoRunWatch=1
WaitForBrowserSeconds=120
LaunchBrowserIfMissing=1
StartupDelayMs=3000
MaximizeBrowser=0
NormalizedWidth=1100
NormalizedHeight=850
RequireAdmin=0
EnableHotkeys=0
ShowStopButton=1

[Timing]
PasteDelayMs=200
SendDelayMs=300
BetweenMessagesMs=900
BetweenGroupsMs=1200
ClipWaitSeconds=3
CaptureSettleMs=600
AfterPublishRecheckMs=800

[Batch]
Size=1
RecheckAfterPublish=0
BetweenBatchesMs=2000

[Harvest]
InitialFullScan=0
; 0 = không cắt, harvest hết nhóm trong file nguồn mỗi vòng.
MaxGroupsPerCycle=0
AuditGroupsPerCycle=0
PublishAfterGroups=1
SaveStateEachGroup=1

[RateLimit]
MaxBatchesPerWatchCycle=10
SendDelayMinMs=3000
SendDelayMaxMs=7000
OutputGroupDelayMinMs=5000
OutputGroupDelayMaxMs=10000
HarvestGroupDelayMinMs=800
HarvestGroupDelayMaxMs=1600

[PublishQueue]
LeaseSize=1
LeaseTimeoutMs=7200000
MaxAttempts=3
RetryBackoffSeconds=300
CompactEveryEvents=250
MaxBatchesPerSession=20
SessionCooldownMs=300000
ListingTtlDays=30
ActiveHoursStart=
ActiveHoursEnd=

[State]
MaxSeenHashes=2000

[Hotkeys]
ForwardListing=^+b
ReleasePhone=^+p
HarvestAll=^+h
PublishMain=^+g
HarvestAndPublish=^+j
RelayImages=^+i
ArchiveMedia=^+m
PausePublish=^+o
StopPublish=^+k
ResolveUncertain=^+u
ReloadConfig=^+r
ToggleWatch=^+w
