[Zalo]
ExeName=Zalo.exe

[Paths]
DataDir=data
ListingsFile=data\listings.json
AccessLogFile=data\access_log.json
HarvestStateFile=data\harvest_state.json

[Groups]
GroupsXlsx=config\zalo-groups.xlsx
GroupsSheet=Groups
GroupsCsv=config\groups.csv
BlocklistXlsx=config\zalo-groups.xlsx
BlocklistSheet=Blocklist
BlocklistCsv=config\blocklist.csv

[Capture]
Method=manual
ListingStartPattern=
ImageMarkerPattern=
MaxMessagesPerGroup=50
; Để trống = chỉ dùng heuristic (LooksLikeListing). Có thể ghi: address,price,owner_phone
RequiredFields=

[Output]
Separator=------------{group}------------
MaxMessageChars=1800
MaskPhone=1
PhoneHint=Nhắn bot "SĐT {room_code}" để lấy số

[Images]
Strategy=forward
ForwardHotkey=^q

[Timing]
SearchDelayMs=400
OpenChatDelayMs=800
PasteDelayMs=200
SendDelayMs=300
BetweenMessagesMs=900
BetweenGroupsMs=1200
ForwardDialogMs=900
ClipWaitSeconds=3
CaptureSettleMs=600
AfterPublishRecheckMs=800

[Batch]
Size=5
RecheckAfterPublish=1
BetweenBatchesMs=2000

[State]
MaxSeenHashes=500

[Hotkeys]
ForwardListing=^+b
ReleasePhone=^+p
HarvestAll=^+h
PublishMain=^+g
HarvestAndPublish=^+j
RelayImages=^+i
ReloadConfig=^+r
